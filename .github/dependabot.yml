version: 2
updates:
  # npm dependencies (dev + runtime). Runtime deps are few and pinned via ranges;
  # grouping keeps PR noise low while still surfacing security bumps promptly.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  # GitHub Actions used by CI/publish workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
