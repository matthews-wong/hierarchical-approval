name: Bug report
description: Report a defect in hierarchical-approval
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please provide a **minimal
        reproduction** — it is by far the most useful thing you can include.
        Do **not** report security vulnerabilities here; follow
        [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I call engine.approve(...), the level is marked approved even though the quorum is not met.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A code snippet or failing test that reproduces the issue. Prefer the MemoryAdapter so it runs anywhere.
      render: typescript
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Library version
      description: Output of `npm ls hierarchical-approval`.
      placeholder: 0.3.1
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Storage adapter
      options:
        - MemoryAdapter
        - PostgresAdapter
        - Custom (implements IStorageAdapter)
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v20.11.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack traces
      description: Paste any error output. This is automatically formatted as code.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is a bug in the library, not a question about how to use it.
          required: true
