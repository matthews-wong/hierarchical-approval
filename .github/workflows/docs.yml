name: Docs

# Builds the TypeDoc API reference and deploys it to GitHub Pages.
# Runs on release tags and on manual dispatch. To enable, set Pages source to
# "GitHub Actions" under Settings → Pages once. If Pages is not enabled the
# deploy step is a no-op the first time and self-heals afterward.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Allow only one concurrent deployment; skip queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API reference
        run: npm run docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
