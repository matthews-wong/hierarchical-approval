name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit production dependencies (block on high/critical CVEs)
        # Was `npm run lint || true`-style decorative once; scoping to runtime deps
        # removed the false positives that motivated that, so a real advisory in a
        # shipped dependency fails the build.
        #
        # npm audit exits non-zero both for "found an advisory" and for "could not
        # reach the advisory endpoint", and a v3.1.0 release was blocked by the
        # latter. Retry the transient case only; a real advisory fails on the
        # first attempt, and an endpoint that stays down still fails the build
        # rather than passing silently.
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level=high --omit=dev 2>&1); then
              echo "$out"
              exit 0
            fi
            if printf '%s' "$out" | grep -qiE 'audit endpoint returned an error|network timeout|ENOTFOUND|ECONNRESET|EAI_AGAIN|ETIMEDOUT'; then
              echo "::warning::npm audit endpoint unreachable (attempt $attempt/3); retrying"
              sleep $((attempt * 10))
              continue
            fi
            echo "$out"
            echo "::error::npm audit reported a high or critical advisory in a runtime dependency"
            exit 1
          done
          echo "::error::npm audit endpoint unreachable after 3 attempts; refusing to publish unaudited"
          exit 1

      - name: Build
        run: npm run build

      - name: Examples (smoke test)
        run: node scripts/examples-smoke.mjs

      - name: Docs (validate API reference generates)
        run: npm run docs
