name: Publish

# Publishes to npm when a version tag (vX.Y.Z) is pushed, or manually via the
# Actions tab. Auth uses npm Trusted Publishing (OIDC) when configured — no
# secret needed — and falls back to an NPM_TOKEN secret if one is set.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist-tag:
        description: 'npm dist-tag to publish under'
        default: 'latest'
        required: false

permissions:
  contents: read
  id-token: write # required for npm provenance + Trusted Publishing via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Do NOT enable cache in release builds — ensures a clean, reproducible install

      - name: Upgrade npm (Trusted Publishing/OIDC requires npm >= 11.5.1)
        # Pin to the 11.x line: it satisfies the OIDC requirement (>= 11.5.1) and
        # supports Node 20. `npm@latest` is now npm 12, which requires Node >= 22
        # and fails EBADENGINE on this job's Node 20 runtime.
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit production dependencies (block on high/critical CVEs)
        # Scoped with --omit=dev deliberately. This package ships only `dist` and
        # has just two runtime deps, so an advisory in the vitest/tsup/esbuild dev
        # chain cannot reach a consumer and must not block a release — that has
        # already happened twice. A high/critical advisory in a RUNTIME dependency
        # still fails this step.
        #
        # npm audit exits non-zero both for "found an advisory" and for "could not
        # reach the advisory endpoint", and a v3.1.0 release was blocked by the
        # latter. Retry the transient case only; a real advisory fails on the
        # first attempt, and an endpoint that stays down still fails the build
        # rather than passing silently.
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level=high --omit=dev 2>&1); then
              echo "$out"
              exit 0
            fi
            if printf '%s' "$out" | grep -qiE 'audit endpoint returned an error|network timeout|ENOTFOUND|ECONNRESET|EAI_AGAIN|ETIMEDOUT'; then
              echo "::warning::npm audit endpoint unreachable (attempt $attempt/3); retrying"
              sleep $((attempt * 10))
              continue
            fi
            echo "$out"
            echo "::error::npm audit reported a high or critical advisory in a runtime dependency"
            exit 1
          done
          echo "::error::npm audit endpoint unreachable after 3 attempts; refusing to publish unaudited"
          exit 1

      - name: Build
        run: npm run build

      - name: Guard — tag must match package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --validate --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Publish with provenance
        run: npm publish --provenance --access public --tag "${{ github.event.inputs.dist-tag || 'latest' }}"
        env:
          # Empty when using Trusted Publishing (OIDC); set the NPM_TOKEN secret to use a token instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
